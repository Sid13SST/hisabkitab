<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HisabKitab: back office for a solo kirana store owner. Udhaar tracking, payment follow-ups, cash forecast and what-if scenarios.">
  <meta name="theme-color" content="#0f766e">
  <title>HisabKitab · Kirana ka back office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard" aria-label="HisabKitab home">
        <span class="brand-mark" aria-hidden="true">₹</span>
        <span class="brand-text">
          <span class="brand-name">HisabKitab</span>
          <span class="brand-tag">Kirana ka back office · हिसाब-किताब</span>
        </span>
      </a>
      <button type="button" class="btn btn-ghost btn-sm" id="reset-btn" title="Restore the original demo dataset">Reset sample data</button>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/customers" data-tab="customers">Customers</a>
      <a href="#/invoices" data-tab="invoices">Invoices</a>
      <a href="#/bills" data-tab="bills">Bills</a>
      <a href="#/forecast" data-tab="forecast">Forecast</a>
      <a href="#/alerts" data-tab="alerts">Alerts <span class="badge" id="alerts-badge" hidden></span></a>
    </nav>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer container">
    <p>Data stays in this browser (localStorage). HisabKitab never sends messages on its own: reminders open in your own WhatsApp.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="container">HisabKitab needs JavaScript enabled.</p></noscript>

  <script src="js/logic.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
